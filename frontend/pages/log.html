<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AlgoBrainOS — Log Problem</title>
  <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="../index.html">🧠 Algo<span>Brain</span>OS</a>
  <div class="nav-links">
    <a href="../index.html">Dashboard</a>
    <a href="log.html" class="active">Log Problem</a>
    <a href="problems.html">Problems</a>
    <a href="recommendations.html">Brain Insights</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Log a <span>Problem</span></h1>
    <p>Document your thinking → AI will analyze your approach and mistakes</p>
  </div>

  <div class="card">
    <div class="form-grid">

      <div class="form-group full">
        <label>Problem Title *</label>
        <input type="text" id="title" placeholder="e.g. Two Sum, Binary Search in Rotated Array..." />
      </div>

      <div class="form-group">
        <label>Platform</label>
        <select id="platform">
          <option>LeetCode</option>
          <option>CodeForces</option>
          <option>GFG</option>
          <option>HackerRank</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Your Difficulty Guess</label>
        <select id="difficulty">
          <option value="Unknown">Let AI decide</option>
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="status">
          <option>Solved</option>
          <option>Attempted</option>
          <option>Need Revision</option>
        </select>
      </div>

      <div class="form-group">
        <label>Time to Solve (minutes)</label>
        <input type="number" id="timeToSolve" placeholder="e.g. 30" min="0" />
      </div>

      <div class="form-group full">
        <label>Your Approach * (The more detail, the better the AI analysis)</label>
        <textarea id="approach" rows="5" placeholder="Describe how you thought about this problem. What data structure did you use? What was your algorithm? Walk through your logic step by step..."></textarea>
      </div>

      <div class="form-group full">
        <label>Mistakes Made (be honest!)</label>
        <textarea id="mistakes" rows="3" placeholder="What went wrong? Did you get TLE? Wrong answer? Off-by-one? Describe your errors and what confused you..."></textarea>
      </div>

      <div class="form-group full">
        <label>Solution Notes / Key Insight</label>
        <textarea id="solution" rows="3" placeholder="The final approach that worked, or the key insight you were missing..."></textarea>
      </div>

      <div class="form-group full" style="display:flex;justify-content:flex-end;gap:1rem">
        <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
        <button class="btn btn-primary" id="submitBtn" onclick="submitProblem()">
          <span id="submitIcon">🧠</span>
          <span id="submitText">Analyze & Log Problem</span>
        </button>
      </div>

    </div>
  </div>

  <!-- AI Result Modal -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🧠 AI Analysis Complete</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>

      <div id="aiResultContent"></div>

      <div style="display:flex;gap:1rem;margin-top:1.5rem;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        <a href="problems.html" class="btn btn-primary">View All Problems →</a>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script>
async function submitProblem() {
  const title = document.getElementById('title').value.trim();
  const approach = document.getElementById('approach').value.trim();

  if (!title) { showToast('Please enter the problem title', 'error'); return; }
  if (!approach) { showToast('Please describe your approach', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitIcon').innerHTML = '<span class="spinner"></span>';
  document.getElementById('submitText').textContent = 'AI is analyzing...';
  showToast('Running AI analysis... this takes ~5 seconds', 'info');

  const payload = {
    title,
    platform: document.getElementById('platform').value,
    difficulty: document.getElementById('difficulty').value,
    approach,
    mistakes: document.getElementById('mistakes').value,
    solution: document.getElementById('solution').value,
    timeToSolve: parseInt(document.getElementById('timeToSolve').value) || 0,
    status: document.getElementById('status').value
  };

  try {
    const data = await api.post('/problems', payload);

    if (data.success) {
      showToast('Problem logged successfully!', 'success');
      renderAIResult(data.problem);
      document.getElementById('resultModal').classList.add('show');
    } else {
      showToast(data.error || 'Something went wrong', 'error');
    }
  } catch (err) {
    showToast('Cannot connect to backend. Is server running on port 5000?', 'error');
    console.error(err);
  } finally {
    btn.disabled = false;
    document.getElementById('submitIcon').textContent = '🧠';
    document.getElementById('submitText').textContent = 'Analyze & Log Problem';
  }
}

function renderAIResult(p) {
  const ai = p.aiTags || {};
  document.getElementById('aiResultContent').innerHTML = `
    <div style="margin-bottom:1rem">
      <div style="font-size:1.1rem;font-weight:800;margin-bottom:0.5rem">${p.title}</div>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <span class="tag tag-${getDiffClass(p.difficulty)}">${p.difficulty}</span>
        ${(ai.topics||[]).map(t=>`<span class="tag tag-topic">${t}</span>`).join('')}
        ${ai.pattern ? `<span class="tag tag-pattern">${ai.pattern}</span>` : ''}
      </div>
    </div>

    <div class="ai-block">
      <div class="ai-block-title">🤖 AI Analysis</div>
      <div class="ai-analysis-text">${ai.analysis || 'Analysis not available'}</div>

      ${(ai.mistakeTypes||[]).length > 0 ? `
        <div style="margin-bottom:0.8rem">
          <div class="detail-label" style="margin-bottom:0.4rem">Mistake Types Detected</div>
          <div style="display:flex;flex-wrap:wrap;gap:0.4rem">${ai.mistakeTypes.map(m=>`<span class="tag tag-mistake">${m}</span>`).join('')}</div>
        </div>` : ''}

      ${(ai.strengthPoints||[]).length > 0 ? `
        <div style="margin-bottom:0.8rem">
          <div class="detail-label" style="margin-bottom:0.4rem">✅ What You Did Well</div>
          ${ai.strengthPoints.map(s=>`<div style="font-size:0.85rem;color:var(--easy);margin-bottom:0.2rem">• ${s}</div>`).join('')}
        </div>` : ''}

      ${(ai.improvementTips||[]).length > 0 ? `
        <div>
          <div class="detail-label" style="margin-bottom:0.4rem">💡 Improvement Tips</div>
          ${ai.improvementTips.map(t=>`<div style="font-size:0.85rem;color:var(--text);margin-bottom:0.2rem">• ${t}</div>`).join('')}
        </div>` : ''}
    </div>`;
}

function closeModal() {
  document.getElementById('resultModal').classList.remove('show');
  clearForm();
}

function clearForm() {
  ['title','approach','mistakes','solution','timeToSolve'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('difficulty').value = 'Unknown';
  document.getElementById('status').value = 'Solved';
  document.getElementById('platform').value = 'LeetCode';
}

document.getElementById('resultModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
