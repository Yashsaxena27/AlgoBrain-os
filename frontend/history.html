<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>History — AlgoBrainOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="os-shell">
    <nav class="sidebar">
      <div class="brand">
        <span class="brand-icon">🧠</span>
        <div>
          <div class="brand-name">AlgoBrainOS</div>
          <div class="brand-sub">DSA Intelligence Layer</div>
        </div>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link" data-page="log">
          <span class="nav-icon">⚡</span> Log Problem
        </a></li>
        <li><a href="dashboard.html" class="nav-link" data-page="dash">
          <span class="nav-icon">📊</span> Dashboard
        </a></li>
        <li><a href="history.html" class="nav-link active" data-page="hist">
          <span class="nav-icon">🗂️</span> Problem History
        </a></li>
      </ul>
      <div class="sidebar-footer">v1.0 · Phase 1 MVP</div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Problem History</h1>
        <p class="page-sub">Every problem you've solved — with full AI analysis</p>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search by name, topic, pattern..." oninput="filterProblems()" />
        <select id="filterDiff" onchange="filterProblems()">
          <option value="">All Difficulties</option>
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </div>

      <div id="historyList"></div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
